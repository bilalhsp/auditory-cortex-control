[build-system]
requires = ["setuptools==75.3.4", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.uv]
cache-dir = "/scratch/gilbreth/ahmedb/cache/uv"
build-constraint-dependencies = [
    "setuptools==75.3.4",
    "wheel==0.45.1",
    "cmake==3.26.4",
    "ninja==1.11.1.3",
]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]

exclude-dependencies = [
    { package = { name = "audioldm" }, dependencies = ["gradio"] },
]

